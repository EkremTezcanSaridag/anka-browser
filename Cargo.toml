[workspace] 
#projenın moduler olacağını belirtir

resolver = "2" #modern paket çözümleyici
members = [
    "crates/anka-url", #ilk modül URL ayrıştırıcı
    "crates/anka-net", #Nete Bağlanabilecek modül
    "crates/anka-html", #HTML kodlarını anlayacak DOM yapısı kuracak modül
    "crates/anka-css",  # CSS stil ve renk kurallarını ayrıştıran modül
    "crates/anka-layout", # Kutuların ekrandaki (x, y) koordinatlarını hesaplayan modül
    "crates/anka-paint",  # Koordinatlı kutuları RGB çizim komutlarına (Display List) çeviren modül
    "crates/anka-js",     # Sıfırdan JavaScript motoru ve canlı DOM API (İstasyon 7)
    "crates/anka-browser", # Tüm motor modüllerini birleştiren ana tarayıcı uygulaması
]

#tüm alt modüllerin bilgilerini içeren kısım 
[workspace.package]
version = "0.2.7"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/EkremTezcanSaridag/anka-browser"